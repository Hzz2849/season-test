<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f2e8">
<title>你灵魂里的季节</title>
<style>
  :root {
    --bg: #f7f2e8;
    --ink: #3f3a33;
    --muted: #8a8175;
    --card: rgba(255, 255, 255, 0.66);
    --line: rgba(63, 58, 51, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 0%, rgba(159, 189, 154, 0.22), transparent 38%),
      radial-gradient(circle at 92% 12%, rgba(223, 160, 107, 0.16), transparent 34%),
      radial-gradient(circle at 50% 100%, rgba(143, 167, 179, 0.18), transparent 42%);
  }

  .app {
    width: 100%;
    max-width: 680px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 26px 18px 42px;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
    animation: fadeUp 0.45s ease both;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .start-card {
    min-height: calc(100vh - 68px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 24px 6px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
  }

  h1 {
    margin: 18px 0 14px;
    font-size: clamp(34px, 9vw, 50px);
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: 0.08em;
  }

  .lead {
    margin: 0 auto;
    max-width: 440px;
    font-size: 16px;
    line-height: 1.95;
    color: #6f675b;
    letter-spacing: 0.03em;
  }

  .primary {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 15px 36px;
    background: var(--ink);
    color: #fff8ee;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(63, 58, 51, 0.16);
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }

  .primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 36px rgba(63, 58, 51, 0.2);
  }

  .primary:active {
    transform: translateY(0);
  }

  .start-card .primary {
    align-self: center;
    margin-top: 30px;
    min-width: 190px;
  }

  .hint {
    margin: 18px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin: 10px 0 12px;
  }

  .q-index {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    white-space: nowrap;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    margin-bottom: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(63, 58, 51, 0.1);
  }

  .progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #9fbd9a, #dfa06b, #b07d4f, #8fa7b3);
    transition: width 0.32s ease;
  }

  .question-card {
    margin-top: 26px;
    padding: 30px 22px 26px;
    border: 1px solid rgba(63, 58, 51, 0.1);
    border-radius: 26px;
    background: var(--card);
    box-shadow: 0 24px 60px rgba(63, 58, 51, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .q-text {
    margin: 0;
    font-size: clamp(20px, 5.2vw, 24px);
    line-height: 1.75;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }

  .option {
    width: 100%;
    display: block;
    padding: 16px 18px;
    border: 1px solid rgba(63, 58, 51, 0.12);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.55);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.65;
    text-align: left;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .option:hover {
    transform: translateY(-1px);
    border-color: rgba(63, 58, 51, 0.22);
    background: rgba(255, 255, 255, 0.86);
  }

  .option.selected {
    border-color: var(--ink);
    background: #fffdf8;
    box-shadow: 0 8px 22px rgba(63, 58, 51, 0.08);
  }

  .quiz-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
  }

  .ghost {
    appearance: none;
    border: none;
    padding: 10px 4px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.18s ease, color 0.18s ease;
  }

  .ghost:hover {
    color: var(--ink);
  }

  .ghost:disabled,
  .ghost.disabled {
    opacity: 0.3;
    cursor: default;
  }

  .ghost.wide {
    width: 100%;
    margin-top: 10px;
  }

  .result-card {
    position: relative;
    margin-top: 18px;
    padding: 36px 24px 26px;
    overflow: hidden;
    border: 1px solid rgba(63, 58, 51, 0.1);
    border-radius: 28px;
    background: linear-gradient(165deg, var(--accent-soft), rgba(255, 255, 255, 0.84) 42%, rgba(255, 255, 255, 0.66));
    box-shadow: 0 24px 60px rgba(63, 58, 51, 0.1);
    text-align: center;
  }

  .result-card[data-season="spring"] {
    --accent: #9fbd9a;
    --accent-soft: rgba(159, 189, 154, 0.22);
    --accent-ink: #5d7d58;
  }

  .result-card[data-season="summer"] {
    --accent: #dfa06b;
    --accent-soft: rgba(223, 160, 107, 0.22);
    --accent-ink: #a45f2a;
  }

  .result-card[data-season="autumn"] {
    --accent: #b07d4f;
    --accent-soft: rgba(176, 125, 79, 0.2);
    --accent-ink: #7a4f2d;
  }

  .result-card[data-season="winter"] {
    --accent: #8fa7b3;
    --accent-soft: rgba(143, 167, 179, 0.22);
    --accent-ink: #4f6b78;
  }

  .result-eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .result-season {
    margin: 12px 0 4px;
    font-size: clamp(40px, 11vw, 58px);
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent-ink);
  }

  .result-subtitle {
    font-size: 18px;
    line-height: 1.7;
    color: #5f574c;
    letter-spacing: 0.04em;
  }

  .result-combo {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 14px;
    border: 1px solid rgba(63, 58, 51, 0.08);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    color: var(--accent-ink);
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 0.03em;
  }

  .keywords {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 22px 0 18px;
  }

  .keywords span {
    padding: 6px 12px;
    border: 1px solid rgba(63, 58, 51, 0.08);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.66);
    color: #5f574c;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .result-desc {
    margin: 0 0 18px;
    color: #5f574c;
    font-size: 15px;
    line-height: 1.9;
    text-align: left;
  }

  .poem {
    margin: 0 0 24px;
    color: var(--accent-ink);
    font-size: 17px;
    line-height: 1.9;
    letter-spacing: 0.04em;
  }

  .share-box {
    margin-bottom: 18px;
    padding: 14px 16px;
    border: 1px dashed rgba(63, 58, 51, 0.18);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.55);
    text-align: left;
  }

  .share-label {
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  .share-text {
    color: #5f574c;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
  }

  .result-card .primary {
    width: 100%;
    background: var(--accent-ink);
    box-shadow: 0 14px 30px rgba(63, 58, 51, 0.14);
  }

  .result-card .primary:hover {
    filter: brightness(1.05);
  }

  .disclaimer {
    margin: 18px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
  }

  @media (max-width: 420px) {
    .app {
      padding: 20px 16px 36px;
    }

    .question-card {
      padding: 26px 18px 22px;
      border-radius: 22px;
    }

    .result-card {
      padding: 32px 18px 22px;
      border-radius: 24px;
    }

    .option {
      padding: 15px 16px;
      font-size: 15px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <section id="startScreen" class="screen active">
    <div class="start-card">
      <div class="eyebrow">A Season In You</div>
      <h1>你灵魂里的季节</h1>
      <p class="lead">30道题，四种气质。<br>看看你更像春、夏、秋、冬里的哪一季。</p>
      <button id="startBtn" class="primary" type="button">开始测试</button>
      <p class="hint">约 3—5 分钟 · 凭第一感觉选择</p>
    </div>
  </section>

  <section id="quizScreen" class="screen">
    <div class="quiz-header">
      <div id="qIndex" class="q-index"></div>
    </div>
    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div class="question-card">
      <p id="qText" class="q-text"></p>
      <div id="options" class="options"></div>
    </div>
    <div class="quiz-footer">
      <button id="prevBtn" class="ghost" type="button">上一题</button>
      <button id="restartBtn" class="ghost" type="button">重新开始</button>
    </div>
  </section>

  <section id="resultScreen" class="screen">
    <div id="resultCard" class="result-card" data-season="spring">
      <div class="result-eyebrow">Your Season</div>
      <div id="resultSeason" class="result-season"></div>
      <div id="resultSubtitle" class="result-subtitle"></div>
      <div id="resultCombo" class="result-combo"></div>
      <div id="resultKeywords" class="keywords"></div>
      <p id="resultDesc" class="result-desc"></p>
      <p id="resultPoem" class="poem"></p>
      <div class="share-box">
        <div class="share-label">分享文案</div>
        <div id="shareText" class="share-text"></div>
      </div>
      <button id="copyBtn" class="primary" type="button">复制结果文案</button>
      <button id="againBtn" class="ghost wide" type="button">重新测试</button>
      <p class="disclaimer">娱乐向自我探索，不是专业心理诊断。</p>
    </div>
  </section>
</div>

<script>
  const questions = [
    {
      q: "清晨第一束光落在窗边，你会——",
      options: [
        { text: "把窗推开，让风和鸟鸣一起进来", dim: "spring" },
        { text: "立刻起身，去追那束光", dim: "summer" },
        { text: "先坐一会儿，看尘埃在光里慢慢落下", dim: "autumn" },
        { text: "把被子裹紧，再偷十分钟梦", dim: "winter" }
      ]
    },
    {
      q: "一场雨突然落下来，你会——",
      options: [
        { text: "冲进雨里，先笑再说", dim: "summer" },
        { text: "站在檐下，看雨把城市洗旧", dim: "autumn" },
        { text: "等雨停，不急着赶路", dim: "winter" },
        { text: "想起某个人，想发一句“下雨了”", dim: "spring" }
      ]
    },
    {
      q: "朋友深夜向你倾诉，你会——",
      options: [
        { text: "安静听完，再慢慢帮他理线", dim: "autumn" },
        { text: "先问：你要陪伴，还是要办法", dim: "winter" },
        { text: "陪他难过，眼眶先红了", dim: "spring" },
        { text: "拉他出门，吃顿热的再说", dim: "summer" }
      ]
    },
    {
      q: "去一座陌生城市旅行，你会——",
      options: [
        { text: "先做一份清清楚楚的路线表", dim: "winter" },
        { text: "到了再说，跟着感觉拐弯", dim: "spring" },
        { text: "去最热闹的街，和陌生人碰杯", dim: "summer" },
        { text: "找一家旧书店，坐到来得及", dim: "autumn" }
      ]
    },
    {
      q: "面对喜欢的人，你更可能——",
      options: [
        { text: "找机会靠近，让喜欢被看见", dim: "spring" },
        { text: "直接说，不给遗憾留座位", dim: "summer" },
        { text: "把心意写成很长的一段话", dim: "autumn" },
        { text: "先观察，确认安全再靠近", dim: "winter" }
      ]
    },
    {
      q: "布置自己的房间，你会——",
      options: [
        { text: "要有花、有颜色，一进门就开心", dim: "summer" },
        { text: "旧票根、旧信都留着，角落要有故事", dim: "autumn" },
        { text: "越简单越好，东西各有各的位置", dim: "winter" },
        { text: "常换小摆件，让房间像刚发芽", dim: "spring" }
      ]
    },
    {
      q: "听到一首老歌，你会——",
      options: [
        { text: "循环到深夜，把旧事翻出来", dim: "autumn" },
        { text: "戴上耳机，把情绪关进自己的房间", dim: "winter" },
        { text: "跟着哼，想起某个人就笑", dim: "spring" },
        { text: "把音量调大，让整个房间热起来", dim: "summer" }
      ]
    },
    {
      q: "一件事卡住了，你会——",
      options: [
        { text: "先停一下，把问题拆成小格子", dim: "winter" },
        { text: "换个新方法，试试没走过的路", dim: "spring" },
        { text: "出去跑一圈，回来再拼", dim: "summer" },
        { text: "写下来，慢慢找那条暗线", dim: "autumn" }
      ]
    },
    {
      q: "周末突然空出来，你会——",
      options: [
        { text: "去公园坐坐，看新叶和小孩", dim: "spring" },
        { text: "约人出门，把白天用到尽兴", dim: "summer" },
        { text: "整理房间，煮一壶茶，听旧唱片", dim: "autumn" },
        { text: "谁也不见，关掉消息，睡到自然醒", dim: "winter" }
      ]
    },
    {
      q: "收到一份意外礼物，你会——",
      options: [
        { text: "立刻拆开，当场表达喜欢", dim: "summer" },
        { text: "先看包装和卡片，猜送礼人的心", dim: "autumn" },
        { text: "说谢谢，收好，过后才慢慢感动", dim: "winter" },
        { text: "回一份亲手做的小礼物", dim: "spring" }
      ]
    },
    {
      q: "与人争执之后，你会——",
      options: [
        { text: "等情绪落下来，再写一段认真说明", dim: "autumn" },
        { text: "先冷静，边界说清楚", dim: "winter" },
        { text: "主动递台阶，不想关系变冷", dim: "spring" },
        { text: "当面讲开，声音大一点也没关系", dim: "summer" }
      ]
    },
    {
      q: "看见一场很美的落日，你会——",
      options: [
        { text: "看一眼就好，天暗了该回家", dim: "winter" },
        { text: "停下来，拍给重要的人看", dim: "spring" },
        { text: "跑到高处，看完整场落幕", dim: "summer" },
        { text: "安静看完，心里有一点旧旧的暖", dim: "autumn" }
      ]
    },
    {
      q: "想到未来，你更习惯——",
      options: [
        { text: "先许一个很大的愿，再慢慢发芽", dim: "spring" },
        { text: "定下目标，今天就开跑", dim: "summer" },
        { text: "把计划写细，留几页给变化", dim: "autumn" },
        { text: "不急着定，走一步看一步，留退路", dim: "winter" }
      ]
    },
    {
      q: "面对一场告别，你会——",
      options: [
        { text: "好好拥抱，把祝福说出口", dim: "summer" },
        { text: "写一封不寄出的信", dim: "autumn" },
        { text: "不送太远，转身就往前走", dim: "winter" },
        { text: "拍一张合照，说以后还要见", dim: "spring" }
      ]
    },
    {
      q: "挑衣服时，你更容易选——",
      options: [
        { text: "舒服、干净、颜色别太吵", dim: "autumn" },
        { text: "黑白灰，利落就好", dim: "winter" },
        { text: "想穿一点亮色，像今天有好事", dim: "spring" },
        { text: "选最醒目的那件，出门就要被看见", dim: "summer" }
      ]
    },
    {
      q: "如果给自己一杯饮品，你会选——",
      options: [
        { text: "热茶，慢慢喝，配一本书", dim: "winter" },
        { text: "花果茶，杯子要好看", dim: "spring" },
        { text: "冰饮，一口气喝下半杯", dim: "summer" },
        { text: "手冲咖啡，苦一点也没关系", dim: "autumn" }
      ]
    },
    {
      q: "朋友聚会里，你更像——",
      options: [
        { text: "那个先开口的人，让场子热起来", dim: "spring" },
        { text: "玩到最晚，负责把气氛推高", dim: "summer" },
        { text: "和两三个人深聊，比热闹更重要", dim: "autumn" },
        { text: "坐在角落，偶尔接话，观察每个人", dim: "winter" }
      ]
    },
    {
      q: "读到一句击中你的话，你会——",
      options: [
        { text: "立刻划线，发给懂的人", dim: "summer" },
        { text: "抄进本子，留到某个夜里再看", dim: "autumn" },
        { text: "合上书，安静想很久", dim: "winter" },
        { text: "心里一亮，像有人替你说出秘密", dim: "spring" }
      ]
    },
    {
      q: "一次失败之后，你更可能——",
      options: [
        { text: "复盘一遍，把教训收进抽屉", dim: "autumn" },
        { text: "沉默一阵，不让人看见狼狈", dim: "winter" },
        { text: "哭完就重新开始，像春天再来", dim: "spring" },
        { text: "找人吃饭吐槽，睡一觉继续冲", dim: "summer" }
      ]
    },
    {
      q: "深夜睡不着，你会——",
      options: [
        { text: "干脆起来，把没做完的事做完", dim: "winter" },
        { text: "给某个人发一句“睡了吗”", dim: "spring" },
        { text: "出门吹风，或找点刺激", dim: "summer" },
        { text: "翻旧照片，听很轻的歌", dim: "autumn" }
      ]
    },
    {
      q: "如果去自然里选一处待着，你会选——",
      options: [
        { text: "初春的河岸，风里有草的味道", dim: "spring" },
        { text: "夏天的海边，太阳晒到皮肤发烫", dim: "summer" },
        { text: "秋天的林间小路，落叶很厚", dim: "autumn" },
        { text: "冬天的雪地，脚印只有一行", dim: "winter" }
      ]
    },
    {
      q: "许愿时，你更容易许下——",
      options: [
        { text: "愿望要热闹：爱、朋友、很多体验", dim: "summer" },
        { text: "愿望要安稳：重要的人都在身边", dim: "autumn" },
        { text: "愿望要自由：不被谁定义", dim: "winter" },
        { text: "愿望要温柔：世界多一点善意", dim: "spring" }
      ]
    },
    {
      q: "关于承诺，你更接近——",
      options: [
        { text: "说出口就做到，时间会证明", dim: "autumn" },
        { text: "不轻易承诺，承诺了就是边界", dim: "winter" },
        { text: "愿意相信，也愿意先伸手", dim: "spring" },
        { text: "现在就做，不等明天", dim: "summer" }
      ]
    },
    {
      q: "被误解时，你会——",
      options: [
        { text: "先沉默，等对方冷静再讲事实", dim: "winter" },
        { text: "有点委屈，但愿意再沟通一次", dim: "spring" },
        { text: "当场说清楚，语气直接", dim: "summer" },
        { text: "不急着辩，懂的人会懂", dim: "autumn" }
      ]
    },
    {
      q: "让你心动的瞬间，更像——",
      options: [
        { text: "他记得你随口说的小事", dim: "spring" },
        { text: "他带你去做一件疯狂的小事", dim: "summer" },
        { text: "他在人群里只安静看你一眼", dim: "autumn" },
        { text: "他在你需要时稳稳站在旁边", dim: "winter" }
      ]
    },
    {
      q: "整理旧物时，你会——",
      options: [
        { text: "该扔就扔，轻装上路", dim: "summer" },
        { text: "每件都看一遍，回忆要收好", dim: "autumn" },
        { text: "分类装箱，贴上标签", dim: "winter" },
        { text: "留下能让自己微笑的，其余送走", dim: "spring" }
      ]
    },
    {
      q: "面对节日，你更喜欢——",
      options: [
        { text: "安静过，和最亲的人吃一顿饭", dim: "autumn" },
        { text: "不太在意形式，平常心就好", dim: "winter" },
        { text: "认真布置，写卡片，制造小惊喜", dim: "spring" },
        { text: "要热闹，要聚齐，要烟花和笑声", dim: "summer" }
      ]
    },
    {
      q: "一个人吃饭时，你会——",
      options: [
        { text: "简单吃完，不拖泥带水", dim: "winter" },
        { text: "拍照记录，给生活一点仪式感", dim: "spring" },
        { text: "边吃边看剧，快乐要立刻有", dim: "summer" },
        { text: "慢慢吃，想一点旧事", dim: "autumn" }
      ]
    },
    {
      q: "面对一个新机会，你会——",
      options: [
        { text: "有兴趣就试，先迈一步", dim: "spring" },
        { text: "马上抓住，机会不等人", dim: "summer" },
        { text: "想清楚再做，但会认真准备", dim: "autumn" },
        { text: "先观察，不轻易离开安全区", dim: "winter" }
      ]
    },
    {
      q: "如果多年后别人记得你，你希望——",
      options: [
        { text: "记得你像一阵热风，来过就亮过", dim: "summer" },
        { text: "记得你像一盏灯，安静但一直在", dim: "autumn" },
        { text: "记得你像一场雪，干净有边界", dim: "winter" },
        { text: "记得你像一场春雨，让什么开始生长", dim: "spring" }
      ]
    }
  ];

  const results = {
    spring: {
      name: "春之型",
      subtitle: "你像一封刚拆开的信",
      keywords: ["好奇", "共情", "生长"],
      desc: "你容易被细节打动，也愿意先向世界伸手。关系里你需要回应，工作里适合创意、沟通、策划。提醒：温柔不要全给别人，也留一点给自己。",
      poem: "你一来，旧枝就有了新意。"
    },
    summer: {
      name: "夏之型",
      subtitle: "你像正午的海",
      keywords: ["热烈", "直接", "行动"],
      desc: "你不太藏情绪，喜欢就靠近，不开心也来得快。关系里你勇敢表达，工作里适合推进、开拓、带节奏。提醒：慢一点，别把燃烧当成唯一证明。",
      poem: "你亮起来的时候，海面没有阴影。"
    },
    autumn: {
      name: "秋之型",
      subtitle: "你像傍晚的书页",
      keywords: ["内省", "审美", "秩序"],
      desc: "你慢热但深情，习惯把话收进心里，再慢慢整理。关系里你重质量，工作里适合分析、设计、整理。提醒：别让所有心事都落灰。",
      poem: "你把心事夹进书页，等它慢慢变黄。"
    },
    winter: {
      name: "冬之型",
      subtitle: "你像落雪后的清晨",
      keywords: ["独立", "理性", "边界"],
      desc: "你需要空间，也不轻易被打扰；看似冷，其实很稳。关系里你重安全，工作里适合研究、规划、深度。提醒：门可以留一条缝，让懂你的人进来。",
      poem: "你不说话，雪已经替你干净了世界。"
    }
  };

  const seasonChar = {
    spring: "春",
    summer: "夏",
    autumn: "秋",
    winter: "冬"
  };

  const subWord = {
    spring: "温柔",
    summer: "勇敢",
    autumn: "细腻",
    winter: "清醒"
  };

  const fixedOrder = ["spring", "summer", "autumn", "winter"];

  const qIndexEl = document.getElementById("qIndex");
  const progressBarEl = document.getElementById("progressBar");
  const qTextEl = document.getElementById("qText");
  const optionsEl = document.getElementById("options");
  const prevBtn = document.getElementById("prevBtn");
  const restartBtn = document.getElementById("restartBtn");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const resultCard = document.getElementById("resultCard");
  const resultSeasonEl = document.getElementById("resultSeason");
  const resultSubtitleEl = document.getElementById("resultSubtitle");
  const resultComboEl = document.getElementById("resultCombo");
  const resultKeywordsEl = document.getElementById("resultKeywords");
  const resultDescEl = document.getElementById("resultDesc");
  const resultPoemEl = document.getElementById("resultPoem");
  const shareTextEl = document.getElementById("shareText");
  const copyBtn = document.getElementById("copyBtn");

  let currentIndex = 0;
  let answers = new Array(questions.length).fill(null);
  let locked = false;
  let currentShareText = "";

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(function (screen) {
      screen.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetQuiz() {
    currentIndex = 0;
    answers = new Array(questions.length).fill(null);
    locked = false;
  }

  function renderQuestion() {
    locked = false;
    const q = questions[currentIndex];

    qIndexEl.textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 题";
    progressBarEl.style.width = ((currentIndex / questions.length) * 100) + "%";
    qTextEl.textContent = q.q;
    optionsEl.innerHTML = "";

    q.options.forEach(function (opt) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = opt.text;
      btn.dataset.dim = opt.dim;

      if (answers[currentIndex] === opt.dim) {
        btn.classList.add("selected");
      }

      btn.addEventListener("click", function () {
        selectOption(opt.dim, btn);
      });

      optionsEl.appendChild(btn);
    });

    prevBtn.disabled = currentIndex === 0;
    prevBtn.classList.toggle("disabled", currentIndex === 0);
  }

  function selectOption(dim, btn) {
    if (locked) return;

    locked = true;
    answers[currentIndex] = dim;

    optionsEl.querySelectorAll(".option").forEach(function (item) {
      item.classList.remove("selected");
    });
    btn.classList.add("selected");

    setTimeout(function () {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        locked = false;
        showResult();
      }
    }, 280);
  }

  function showResult() {
    const counts = {
      spring: 0,
      summer: 0,
      autumn: 0,
      winter: 0
    };

    answers.forEach(function (dim) {
      if (dim && counts[dim] !== undefined) {
        counts[dim] += 1;
      }
    });

    const maxCount = Math.max(
      counts.spring,
      counts.summer,
      counts.autumn,
      counts.winter
    );

    let mainCandidates = fixedOrder.filter(function (dim) {
      return counts[dim] === maxCount;
    });

    let main;

    if (mainCandidates.length === 1) {
      main = mainCandidates[0];
    } else {
      const lastAnswer = answers[answers.length - 1];
      const firstAnswer = answers[0];

      if (lastAnswer && mainCandidates.indexOf(lastAnswer) !== -1) {
        main = lastAnswer;
      } else if (firstAnswer && mainCandidates.indexOf(firstAnswer) !== -1) {
        main = firstAnswer;
      } else {
        main = mainCandidates[0];
      }
    }

    const remaining = fixedOrder.filter(function (dim) {
      return dim !== main;
    });

    remaining.sort(function (a, b) {
      if (counts[b] !== counts[a]) return counts[b] - counts[a];
      return fixedOrder.indexOf(a) - fixedOrder.indexOf(b);
    });

    const sub = remaining[0];
    const mainData = results[main];
    const subData = results[sub];

    resultCard.dataset.season = main;
    resultSeasonEl.textContent = mainData.name;
    resultSubtitleEl.textContent = mainData.subtitle;
    resultComboEl.textContent = "你是" + mainData.name + "，带一点" + seasonChar[sub] + "的" + subWord[sub] + "。";

    resultKeywordsEl.innerHTML = mainData.keywords
      .map(function (word) {
        return "<span>" + word + "</span>";
      })
      .join("");

    resultDescEl.textContent = mainData.desc;
    resultPoemEl.textContent = mainData.poem;

    currentShareText =
      "我的灵魂季节是「" + mainData.name + "」，带一点" + seasonChar[sub] + "的" + subWord[sub] + "。\n" +
      mainData.poem + "\n" +
      "#灵魂季节测试 #性格测试";

    shareTextEl.textContent = currentShareText;
    copyBtn.textContent = "复制结果文案";

    showScreen("resultScreen");
  }

  async function copyResult() {
    if (!currentShareText) return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(currentShareText);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = currentShareText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      copyBtn.textContent = "已复制";
      setTimeout(function () {
        copyBtn.textContent = "复制结果文案";
      }, 1600);
    } catch (error) {
      copyBtn.textContent = "复制失败，请长按选择";
      setTimeout(function () {
        copyBtn.textContent = "复制结果文案";
      }, 2000);
    }
  }

  startBtn.addEventListener("click", function () {
    resetQuiz();
    showScreen("quizScreen");
    renderQuestion();
  });

  prevBtn.addEventListener("click", function () {
    if (locked) return;
    if (currentIndex > 0) {
      currentIndex -= 1;
      renderQuestion();
    }
  });

  restartBtn.addEventListener("click", function () {
    resetQuiz();
    renderQuestion();
  });

  againBtn.addEventListener("click", function () {
    resetQuiz();
    showScreen("quizScreen");
    renderQuestion();
  });

  copyBtn.addEventListener("click", copyResult);
</script>
</body>
</html>
